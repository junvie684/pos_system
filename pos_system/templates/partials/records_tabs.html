{# Shared tab bar + list styles for the Records module: Customers · Products · Categories. #}
{% with url_name=request.resolver_match.url_name %}
<nav class="module-tabs" aria-label="Records">
  <a href="{% url 'customers:customer_list' %}" class="module-tab{% if url_name == 'customer_list' %} is-on{% endif %}"{% if url_name == 'customer_list' %} aria-current="page"{% endif %}>
    <i class="bi bi-people" aria-hidden="true"></i>Customers
  </a>
  {% if user.profile.can_access_products %}
  <a href="{% url 'products:product_list' %}" class="module-tab{% if url_name == 'product_list' %} is-on{% endif %}"{% if url_name == 'product_list' %} aria-current="page"{% endif %}>
    <i class="bi bi-box-seam" aria-hidden="true"></i>Products
  </a>
  {% endif %}
  {% if user.profile.can_access_categories %}
  <a href="{% url 'products:category_list' %}" class="module-tab{% if url_name == 'category_list' %} is-on{% endif %}"{% if url_name == 'category_list' %} aria-current="page"{% endif %}>
    <i class="bi bi-tags" aria-hidden="true"></i>Categories
  </a>
  {% endif %}
</nav>
{% endwith %}
<style>
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }

  /* ── Tabs ── */
  .rx-box { padding: 0; overflow: hidden; }
  .module-tabs { display: flex; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--rule); background: var(--paper); overflow-x: auto; scrollbar-width: none; }
  .module-tabs::-webkit-scrollbar { display: none; }
  .module-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; margin-bottom: -1px; border-bottom: 3px solid transparent; color: var(--ink-2); font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: color .12s, border-color .12s, background-color .12s; }
  .module-tab i { font-size: 16px; color: var(--ink-3); }
  .module-tab:hover { color: var(--ink); background: var(--paper-2); }
  .module-tab.is-on { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
  .module-tab.is-on i { color: var(--ink); }

  /* ── Toolbar: search, filters, count ── */
  .rx-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; }
  .rx-search { position: relative; flex: 0 1 340px; min-width: 220px; }
  .rx-search .bi { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 14px; pointer-events: none; }
  .rx-search .form-control { min-height: 36px; height: 36px; padding: 0 10px 0 32px; font-size: 14px; }
  .rx-seg { display: inline-flex; border: 1px solid var(--rule-strong); background: var(--panel); flex-shrink: 0; }
  .rx-seg a { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); text-decoration: none; white-space: nowrap; transition: background-color .12s, color .12s; }
  .rx-seg a + a { border-left: 1px solid var(--rule); }
  .rx-seg a:hover { background: var(--paper-2); color: var(--ink); }
  .rx-seg a.is-on { background: var(--ink); color: #fff; }
  .rx-seg .fig { font-size: 12px; color: var(--ink-3); }
  .rx-seg a.is-on .fig { color: var(--rail-ink-muted); }
  .rx-count { margin-left: auto; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .rx-count .fig { color: var(--ink); font-weight: 700; }

  /* ── Dense table ── */
  .rx-card { padding: 0; overflow: hidden; border-top: 1px solid var(--rule); }
  .rx-table { font-size: 13.5px; }
  .rx-table thead th { padding: 8px 12px; font-size: 11px; background: var(--paper-2); }
  .rx-table tbody td { padding: 6px 12px; height: 46px; color: var(--ink-2); white-space: nowrap; }
  .rx-table th:first-child, .rx-table td:first-child { padding-left: 16px; }
  .rx-table th:last-child, .rx-table td:last-child { padding-right: 10px; }
  .rx-table tbody tr:nth-child(even) { background: #FCFCFA; }
  .rx-table tbody tr:hover { background: var(--carbon); }
  .rx-table .num { text-align: right; }
  .rx-table tr[hidden] { display: none !important; }
  .rx-name { color: var(--ink); font-weight: 600; }
  .rx-sub { display: block; font-family: var(--font-fig); font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .rx-muted { color: var(--ink-3); }
  .rx-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rx-avatar { width: 28px; height: 28px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--carbon); color: var(--carbon-ink); font-size: 12px; font-weight: 700; }
  .rx-actions { display: flex; gap: 2px; justify-content: flex-end; align-items: center; }
  .rx-icon { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; color: var(--ink-2); font-size: 15px; text-decoration: none; cursor: pointer; transition: background-color .12s, border-color .12s, color .12s; }
  .rx-icon:hover { background: var(--panel); border-color: var(--rule-strong); color: var(--ink); }
  .rx-icon.is-danger:hover { background: var(--red-tint); border-color: var(--red-rule); color: var(--red-ink); }
  .rx-table .rx-empty { text-align: center; height: auto; padding: 44px 16px !important; color: var(--ink-3); white-space: normal; }
  .rx-empty .bi { display: block; font-size: 24px; color: var(--rule-strong); margin-bottom: 8px; }
  .rx-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--rule); background: var(--paper); font-size: 13px; color: var(--ink-2); }
  .rx-foot .pg { height: 30px; min-width: 30px; }

  /* ── Dialog bits ── */
  .modal-body { padding: 18px 20px; }
  .modal-footer { justify-content: flex-end; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .req { font-weight: 400; color: var(--ink-3); margin-left: 4px; font-size: 12px; }
  .del-q { font-size: 16px; }
  .del-note { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

  /* ── Toast ── */
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 9999; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(30,36,48,.25); max-width: calc(100vw - 32px); transition: transform .22s var(--ease-out), opacity .22s var(--ease-out); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.success .bi { color: #7BD3A0; }
  .toast.warning .bi { color: #F2C46B; }
  .toast.error { background: var(--red); }

  @media (max-width: 760px) {
    .rx-toolbar { padding: 12px; }
    .module-tab { flex: 1 0 auto; justify-content: center; padding: 0 12px; }
    .rx-search { flex: 1 1 100%; }
    .rx-seg { width: 100%; }
    .rx-seg a { flex: 1; justify-content: center; padding: 0 6px; }
    .rx-count { margin-left: 0; }
    .form-grid { grid-template-columns: 1fr; gap: 0; }
  }
</style>
<script>
  // Shared by the Records pages
  const RX_TOAST_ICONS = { success: 'bi-check-circle-fill', error: 'bi-x-circle-fill', warning: 'bi-exclamation-triangle-fill' };
  function rxToast(msg, type) {
    type = type || 'success';
    let t = document.getElementById('toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.className = 'toast ' + type;
    t.innerHTML = '<i class="bi ' + RX_TOAST_ICONS[type] + '" aria-hidden="true"></i><span></span>';
    t.querySelector('span').textContent = msg;
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(rxToast._t);
    rxToast._t = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function rxEsc(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : text;
    return div.innerHTML;
  }
</script>
